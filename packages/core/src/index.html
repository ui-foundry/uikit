<!doctype html>
<html dir="ltr" lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0" />
	<title>Component Starter</title>

	<link rel="stylesheet" href="/build/uikit.css" />

	<script>
		// Automatically set data-color-scheme on <html> based on system theme
		const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
		document.documentElement.setAttribute("data-color-scheme", systemTheme);

		// Optional: Update on system change
		window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
			const newTheme = e.matches ? "dark" : "light";
			document.documentElement.setAttribute("data-color-scheme", newTheme);
		});
	</script>

	<script type="module" src="/build/uikit.esm.js"></script>
	<script nomodule src="/build/uikit.js"></script>
</head>

<body style="padding: 30px">
	<bq-breadcrumb label="Breadcrumb">
		<bq-breadcrumb-item>Home</bq-breadcrumb-item>
		<bq-breadcrumb-item>Men's clothing</bq-breadcrumb-item>
		<bq-breadcrumb-item>Shirt</bq-breadcrumb-item>
		<bq-breadcrumb-item>Casual shirts</bq-breadcrumb-item>
	</bq-breadcrumb>
</body>

</html>
